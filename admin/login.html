<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Administration Immolode</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="/assets/images/logo.svg" alt="Immolode Logo">
      <h1>Immolode</h1>
      <p>Portail d'administration</p>
    </div>

    <div id="login-alert-slot"></div>

    <form id="login-form">
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="email">Adresse e-mail</label>
        <input type="text" id="email" name="email" class="form-input" placeholder="admin@immolode.dz" required autofocus autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" id="btn-submit" style="width: 100%;">
        Se connecter
      </button>
    </form>

    <div class="login-hint-card">
      <p>Compte de démonstration :</p>
      <div>E-mail : <code>admin@immolode.dz</code></div>
      <div>Mot de passe : <code>admin123</code></div>
      <button type="button" class="login-hint-btn" id="btn-fill-demo">Remplir les identifiants</button>
    </div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="/client/" style="font-size: 0.82rem; color: var(--admin-text-muted); text-decoration: underline;">
        &larr; Retourner sur le site public
      </a>
    </div>
  </div>

  <script type="module" src="/admin/login.js"></script>
</body>
</html>
